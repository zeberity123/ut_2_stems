[package]
name = "ut-stems"
version = "0.6.1"
description = "Split a song into MP3 stems: vocals, bass, drums, guitars, piano, others"
authors = ["zeberity123"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ut_stems_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ureq = "3"
sha2 = "0.11"
sevenz-rust2 = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
